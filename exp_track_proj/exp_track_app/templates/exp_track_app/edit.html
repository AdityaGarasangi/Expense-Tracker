{% extends 'exp_track_app/baseTemp.html' %}
{% load static %}

{% block title %}
  Edit Expense
{% endblock %}

{% block content %}
  <h2 class="text-2xl font-bold text-gray-900 mb-5">Edit Expense</h2>
  <form class="bg-white shadow-lg p-6 rounded-lg" method="POST">
    {% csrf_token %}
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label class="font-semibold text-gray-700 mb-2 block" for="">Expense Name</label>
        <div class="border border-gray-300 rounded-lg p-2">{{ expense_form.name }}</div>
      </div>
      <div>
        <label class="font-semibold text-gray-700 mb-2 block" for="">Amount</label>
        <div class="border border-gray-300 rounded-lg p-2">{{ expense_form.amount }}</div>
      </div>
      <div>
        <label class="font-semibold text-gray-700 mb-2 block" for="">Category</label>
        <div class="border border-gray-300 rounded-lg p-2">{{ expense_form.category }}</div>
      </div>
    </div>

    <div class="flex justify-start mt-5">
      <button class="bg-yellow-500 hover:bg-yellow-400 px-5 py-2 rounded-lg text-white font-bold mr-5" type="submit">Save Changes</button>
      <a class="bg-gray-700 hover:bg-gray-500 px-5 py-2 rounded-lg text-white font-bold" href="{% url 'index' %}">Home</a>
    </div>
  </form>
{% endblock %}
