{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}
        Expense Tracker
      {% endblock %}
    </title>
    <link rel="stylesheet" href="{% static 'exp_track_app/style.css' %}" />
    <link rel="stylesheet" href="{% static 'exp_track_app/style2.css' %}" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100">
    <nav class="shadow-md p-4 bg-gray-800">
      <div class="container mx-auto flex justify-between items-center">
        <a href="" class="flex items-center">
          <img class="h-10 mr-3" src="{% static 'exp_track_app/images/logo.png' %}" alt="Logo" />
          <span class="text-xl font-semibold text-white">Expense Tracker</span>
        </a>
      </div>
    </nav>
    <main class="container mx-auto mt-10">
      {% block content %}

      {% endblock %}
    </main>
  </body>
</html>
